<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <polygon points="200,20 360,70 360,250 200,380 40,250 40,70" fill="#0c0e17" stroke="url(#cyberGold)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner Cyber Contour -->
  <polygon points="200,35 345,80 345,240 200,360 55,240 55,80" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- University Header Arch -->
  <path id="arch" d="M 75,110 Q 200,45 325,110" fill="none"/>
  <text font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ffd700" letter-spacing="4" text-anchor="middle">
    <textPath href="#arch" startOffset="50%" text-anchor="middle">PILLAI UNIVERSITY</textPath>
  </text>

  <!-- Est. 2002 Tag -->
  <rect x="135" y="105" width="130" height="22" rx="4" fill="#0d1b3e" stroke="#c59b27" stroke-width="1.2"/>
  <text x="200" y="120" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">25 YEARS • 2002-2027</text>

  <!-- Big Central CA Letters -->
  <text x="200" y="210" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="78" font-weight="900" fill="url(#cyberGold)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">CA</text>

  <!-- Silver Jubilee Banner -->
  <polygon points="65,255 335,255 320,295 80,295" fill="#c59b27" stroke="#9a761c" stroke-width="2"/>
  <text x="200" y="282" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SILVER JUBILEE</text>
  
  <rect x="90" y="303" width="220" height="22" rx="3" fill="#0a192f" stroke="#c59b27" stroke-width="1.5"/>
  <text x="200" y="318" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2.5">COMPUTER ASSOCIATION</text>

  <!-- Star accents -->
  <polygon points="120,230 125,242 138,242 127,250 131,262 120,254 109,262 113,250 102,242 115,242" fill="#ffd700"/>
  <polygon points="280,230 285,242 298,242 287,250 291,262 280,254 269,262 273,250 262,242 275,242" fill="#ffd700"/>
</svg>
