<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140c"/>
      <stop offset="50%" stop-color="#0d2416"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGit)"/>

  <!-- Matrix / Git Branch Graph Lines -->
  <g stroke="rgba(0,255,136,0.12)" stroke-width="2">
    <path d="M 200 450 L 300 350 L 500 350 L 600 450" fill="none"/>
    <path d="M 300 350 L 400 230 L 500 350" fill="none"/>
  </g>

  <!-- Central Git Branch Node Icon -->
  <circle cx="400" cy="225" r="95" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="2" filter="url(#glowGreen)"/>
  
  <!-- GitHub / Branch Icon -->
  <g transform="translate(360, 185) scale(1.6)" fill="#00ff88" filter="url(#glowGreen)">
    <circle cx="12" cy="7" r="4"/>
    <circle cx="12" cy="43" r="4"/>
    <circle cx="38" cy="18" r="4"/>
    <path d="M 12 11 L 12 39" stroke="#00ff88" stroke-width="3"/>
    <path d="M 12 25 Q 24 25 38 22" fill="none" stroke="#00ff88" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="400" y="385" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">GITHUB EVENT</text>
  <text x="400" y="420" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#00ff88" text-anchor="middle" letter-spacing="4">OPEN SOURCE // DEV WORKSHOPS &amp; SPRINTS</text>

  <!-- Instruction Badge -->
  <rect x="230" y="465" width="340" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
  <text x="400" y="489" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa5be" text-anchor="middle">[ REPLACE WITH YOUR GITHUB EVENT PHOTO ]</text>
</svg>
