<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12060b"/>
      <stop offset="50%" stop-color="#280c16"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <linearGradient id="maroonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5a823"/>
      <stop offset="100%" stop-color="#7b1123"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Cyber Grid -->
  <g stroke="rgba(229,168,35,0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Central Badge & Graphic -->
  <circle cx="400" cy="240" r="110" fill="rgba(123,17,35,0.3)" stroke="#e5a823" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Graduation / Induction Cap Icon -->
  <path d="M 330 220 L 400 180 L 470 220 L 400 260 Z" fill="#e5a823" filter="url(#glow)"/>
  <path d="M 360 238 L 360 270 Q 400 300 440 270 L 440 238" fill="none" stroke="#e5a823" stroke-width="6"/>
  <line x1="460" y1="220" x2="475" y2="265" stroke="#ffd700" stroke-width="4"/>
  <circle cx="475" cy="270" r="5" fill="#ffd700"/>

  <!-- Welcome / Induction Title -->
  <text x="400" y="390" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">BCA INDUCTION</text>
  <text x="400" y="425" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#e5a823" text-anchor="middle" letter-spacing="4">PILLAI UNIVERSITY // WELCOMING FRESHMINDS</text>

  <!-- Instruction Badge -->
  <rect x="230" y="470" width="340" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(229,168,35,0.3)" stroke-width="1"/>
  <text x="400" y="494" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa5be" text-anchor="middle">[ REPLACE WITH YOUR BCA INDUCTION PHOTO ]</text>
</svg>
