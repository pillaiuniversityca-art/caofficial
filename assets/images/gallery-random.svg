<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgRandom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06"/>
      <stop offset="50%" stop-color="#281a0a"/>
      <stop offset="100%" stop-color="#080705"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgRandom)"/>

  <!-- Geometric accent particles -->
  <g fill="rgba(255,215,0,0.12)">
    <polygon points="120,100 140,80 160,100 140,120"/>
    <polygon points="680,140 700,120 720,140 700,160"/>
    <polygon points="100,480 120,460 140,480 120,500"/>
    <polygon points="700,460 720,440 740,460 720,480"/>
  </g>

  <!-- Central Camera / Sparkles Badge -->
  <circle cx="400" cy="225" r="95" fill="rgba(255,215,0,0.06)" stroke="#ffd700" stroke-width="2" filter="url(#glowGold)"/>
  
  <!-- Camera / Sparkle Icon -->
  <g transform="translate(360, 185) scale(1.6)" fill="#ffd700" filter="url(#glowGold)">
    <path d="M 10 12 L 16 7 L 34 7 L 40 12 L 46 12 C 48 12 50 14 50 16 L 50 40 C 50 42 48 44 46 44 L 4 44 C 2 44 0 42 0 40 L 0 16 C 0 14 2 12 4 12 Z"/>
    <circle cx="25" cy="28" r="9" fill="#281a0a" stroke="#ffd700" stroke-width="3"/>
    <circle cx="25" cy="28" r="4" fill="#ffd700"/>
  </g>

  <!-- Title -->
  <text x="400" y="385" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">RANDOM MOMENTS</text>
  <text x="400" y="420" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffd700" text-anchor="middle" letter-spacing="4">CAMPUS LIFE // MEMORIES &amp; BEHIND-THE-SCENES</text>

  <!-- Instruction Badge -->
  <rect x="230" y="465" width="340" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,215,0,0.3)" stroke-width="1"/>
  <text x="400" y="489" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa5be" text-anchor="middle">[ REPLACE WITH YOUR RANDOM PHOTO ]</text>
</svg>
