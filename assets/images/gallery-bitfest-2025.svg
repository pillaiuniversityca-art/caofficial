<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgFest25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140618"/>
      <stop offset="50%" stop-color="#280c33"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgFest25)"/>

  <!-- Cyber arcade grid -->
  <g stroke="rgba(255,0,127,0.12)" stroke-width="1.5">
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="600" x2="350" y2="450"/>
    <line x1="300" y1="600" x2="400" y2="450"/>
    <line x1="500" y1="600" x2="450" y2="450"/>
    <line x1="700" y1="600" x2="500" y2="450"/>
  </g>

  <!-- Central Trophy / Arcade Badge -->
  <circle cx="400" cy="225" r="95" fill="rgba(255,0,127,0.06)" stroke="#ff007f" stroke-width="2" filter="url(#glowMagenta)"/>
  
  <!-- Trophy / Fest Icon -->
  <path d="M 360 175 L 440 175 L 430 235 Q 400 265 370 235 Z" fill="#ff007f" filter="url(#glowMagenta)"/>
  <path d="M 360 185 C 330 185 330 220 365 220" fill="none" stroke="#ff007f" stroke-width="4"/>
  <path d="M 440 185 C 470 185 470 220 435 220" fill="none" stroke="#ff007f" stroke-width="4"/>
  <rect x="390" y="255" width="20" height="25" fill="#ff007f"/>
  <rect x="370" y="280" width="60" height="12" rx="4" fill="#ff007f"/>

  <!-- Title -->
  <text x="400" y="385" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">BITFEST 2025</text>
  <text x="400" y="420" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ff007f" text-anchor="middle" letter-spacing="4">PREVIOUS EDITION HIGHLIGHTS &amp; WINNERS</text>

  <!-- Instruction Badge -->
  <rect x="230" y="465" width="340" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,0,127,0.3)" stroke-width="1"/>
  <text x="400" y="489" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9aa5be" text-anchor="middle">[ REPLACE WITH YOUR BITFEST 2025 PHOTO ]</text>
</svg>
